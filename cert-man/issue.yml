apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: issuer 
spec:
  acme:
    server: "https://acme-v02.api.letsencrypt.org/directory"
    email: "sehindemitech@gmail.com"
    privateKeySecretRef:
      name: issuer
    solvers:
      - dns01:
          route53:
            hostedZoneID: Z015735937DKRR175WMTP
            region: eu-west-2
        selector:
          dnsZones:
            - "lab.demitech.co.uk"
      - http01:
          ingress: 
            class: nginx